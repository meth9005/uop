<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ======================================================
         DOCUMENT SETTINGS
         ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!--
        Prevent search engines from indexing the administration
        login page.
    -->
    <meta
        name="robots"
        content="noindex, nofollow"
    >


    <title>
        Administrator Login |
        English Teaching Unit - UoP
    </title>



    <!-- ======================================================
         SUPABASE JAVASCRIPT SDK
         ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ======================================================
         TAILWIND CSS
         ====================================================== -->

    <script
        src="https://cdn.tailwindcss.com"
    ></script>



    <!-- ======================================================
         SHARED PORTAL TAILWIND CONFIG
         ====================================================== -->

    <script
        src="assets/js/config/tailwind.js"
    ></script>



    <!-- ======================================================
         FONTS
         ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >



    <!-- ======================================================
         SHARED PORTAL CSS
         ====================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/app.css?v=20260924-crest"
    >

    <link rel="icon" type="image/png" href="assets/images/uoplogo.png">
</head>



<body class="portal
        min-h-screen
        bg-slate-100
        text-slate-800
        font-sans
        antialiased
        flex
        items-center
        justify-center
        p-6
    "
>


    <!-- ======================================================
         LOGIN PAGE
         ====================================================== -->

    <main
        class="
            w-full
            max-w-md
        "
    >


        <!-- ==================================================
             LOGIN CARD
             ================================================== -->

        <div
            class="
                bg-white
                border
                border-slate-200
                shadow-none
                rounded-md
                p-8
            "
        >


            <!-- ==============================================
                 PORTAL IDENTITY
                 ============================================== -->

            <div
                class="
                    text-center
                    mb-7
                "
            >


                <!-- University logo -->
                <img
                    src="assets/images/uoplogo.png"
                    alt="University of Peradeniya"
                    class="
                        h-16
                        mx-auto
                        mb-4
                        object-contain
                    "
                >


                <p
                    class="
                        text-xs
                        font-bold
                        uppercase
                        tracking-wider
                        text-accent-gold
                        mb-1
                    "
                >
                    English Teaching Unit
                </p>


                <h1
                    class="
                        text-2xl
                        font-serif
                        font-bold
                        text-navy-900
                    "
                >
                    Administrator Login
                </h1>


                <p
                    class="
                        text-xs
                        text-slate-500
                        mt-2
                    "
                >
                    Authorized portal management only.
                </p>

            </div>



            <!-- ==============================================
                 LOGIN ERROR MESSAGE
                 ==============================================

                 Hidden normally.

                 JavaScript reveals this when login fails.
                 ============================================== -->

            <div
                id="login-error"
                hidden
                role="alert"
                class="
                    mb-4
                    rounded-lg
                    border
                    border-red-200
                    bg-red-50
                    px-4
                    py-3
                    text-xs
                    text-red-700
                "
            >
            </div>



            <!-- ==============================================
                 LOGIN FORM
                 ============================================== -->

            <form
                id="admin-login-form"
                class="space-y-4"
            >


                <!-- ==========================================
                     ADMIN EMAIL
                     ========================================== -->

                <div>

                    <label
                        class="form-label"
                        for="admin-email"
                    >
                        Email
                    </label>


                    <input
                        id="admin-email"
                        name="email"
                        class="form-control"
                        type="email"
                        autocomplete="username"
                        placeholder="Administrator email"
                        required
                    >

                </div>



                <!-- ======================================================
     ADMIN PASSWORD
     ======================================================

     The password field is wrapped in a relative container
     so the eye button can appear inside the input.

     The button does NOT submit the form because:

         type="button"

     JavaScript will switch the input between:

         type="password"

     and:

         type="text"
     ====================================================== -->

<div>

    <label
        class="form-label"
        for="admin-password"
    >
        Password
    </label>


    <!-- Password input + visibility button -->
    <div class="relative">


        <!-- Password field -->
        <input
            id="admin-password"
            name="password"
            class="form-control pr-12"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
        >


        <!-- ==================================================
             SHOW / HIDE PASSWORD BUTTON
             ==================================================

             This button is controlled by adminLoginPage.js.

             Initial state:

                 password hidden
                 eye icon shown

             After click:

                 password visible
                 crossed-eye icon shown
             ================================================== -->

        <button
            id="toggle-password"
            type="button"
            class="
                absolute
                inset-y-0
                right-0
                flex
                items-center
                justify-center
                w-11
                text-slate-400
                hover:text-navy-900
                transition
            "
            aria-label="Show password"
            aria-pressed="false"
        >


            <!-- ==============================================
                 EYE ICON - PASSWORD CURRENTLY HIDDEN
                 ============================================== -->

            <svg
                id="password-eye-open"
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="
                        M2.036 12.322
                        a1.012 1.012 0 0 1 0-.639
                        C3.423 7.51 7.36 4.5 12 4.5
                        c4.638 0 8.573 3.007 9.963 7.178
                        .07.207.07.431 0 .639
                        C20.577 16.49 16.64 19.5 12 19.5
                        c-4.638 0-8.573-3.007-9.964-7.178Z
                    "
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="
                        M15 12
                        a3 3 0 1 1-6 0
                        3 3 0 0 1 6 0Z
                    "
                />

            </svg>


            <!-- ==============================================
                 CROSSED EYE ICON - PASSWORD CURRENTLY VISIBLE

                 Hidden initially.
                 ============================================== -->

            <svg
                id="password-eye-closed"
                class="w-5 h-5 hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
            >

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="
                        M3.98 8.223
                        A10.477 10.477 0 0 0 1.934 12
                        C3.226 15.91 7.43 19.5 12 19.5
                        c1.596 0 3.11-.438 4.46-1.22
                    "
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="
                        M6.228 6.228
                        A9.989 9.989 0 0 1 12 4.5
                        c4.638 0 8.573 3.007 9.963 7.178
                        .07.207.07.431 0 .639
                        a10.64 10.64 0 0 1-2.293 3.95
                    "
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.53 15.53A5 5 0 0 1 8.47 8.47"
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m3 3 18 18"
                />

            </svg>

        </button>

    </div>

</div>



                <!-- ==========================================
                     LOGIN BUTTON
                     ========================================== -->

                <button
                    id="login-submit"
                    type="submit"
                    class="button button-primary
                        w-full
                        bg-navy-900
                        hover:bg-navy-800
                        disabled:opacity-60
                        disabled:cursor-not-allowed
                        text-white
                        font-semibold
                        py-3
                        rounded-lg
                        transition
                    "
                >
                    Sign in
                </button>

            </form>



            <!-- ==============================================
                 RETURN TO PUBLIC WEBSITE
                 ============================================== -->

            <div
                class="
                    mt-6
                    pt-5
                    border-t
                    border-slate-100
                    text-center
                "
            >

                <a
                    href="index.html"
                    class="
                        text-xs
                        font-semibold
                        text-slate-500
                        hover:text-accent-gold
                        transition
                    "
                >
                    ← Return to website
                </a>

            </div>

        </div>



        <!-- ==================================================
             SECURITY NOTE
             ================================================== -->

        <p
            class="
                text-[10px]
                text-center
                text-slate-400
                mt-4
                leading-relaxed
            "
        >
            For security, this page is only accessible to authorized administrators. If you are not an administrator, please return to the public website.
        </p>

    </main>



    <!-- ======================================================
         LOGIN PAGE CONTROLLER
         ======================================================

         IMPORTANT:

         type="module" is required because adminLoginPage.js
         imports authService.js.
         ====================================================== -->

    <script
        type="module"
        src="assets/js/pages/adminLoginPage.js"
    ></script>


</body>

</html>
